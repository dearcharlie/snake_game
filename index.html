<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snake Game</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #1a1a2e;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        font-family: 'Segoe UI', system-ui, sans-serif;
        color: #eee;
      }
      #app {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }
      #score-bar {
        display: flex;
        justify-content: space-between;
        width: 600px;
        padding: 12px 20px;
        background: #16213e;
        border-radius: 8px;
        font-size: 18px;
      }
      #score-bar span {
        color: #aaa;
      }
      #score-bar .value {
        color: #00d9ff;
        font-weight: bold;
      }
      #game-container {
        position: relative;
      }
      #game-canvas {
        background: #0f0f1a;
        border: 2px solid #16213e;
        border-radius: 8px;
        display: block;
      }
      #overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.7);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        border-radius: 8px;
        gap: 20px;
      }
      #overlay.hidden {
        display: none;
      }
      #overlay h1 {
        font-size: 48px;
        color: #ff6b6b;
      }
      #overlay p {
        font-size: 20px;
        color: #aaa;
      }
      #controls {
        color: #666;
        font-size: 14px;
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="score-bar">
        <div>Score: <span class="value" id="score">0</span></div>
        <div>Best: <span class="value" id="high-score">0</span></div>
        <div><span id="status">Press SPACE to start</span></div>
      </div>
      <div id="game-container">
        <canvas id="game-canvas" width="600" height="400"></canvas>
        <div id="overlay" class="hidden">
          <h1 id="overlay-title">GAME OVER</h1>
          <p id="overlay-score">Score: 0</p>
          <p>Press SPACE or ENTER to restart</p>
        </div>
      </div>
      <div id="controls">WASD / Arrow Keys to move &nbsp;|&nbsp; SPACE to start/pause &nbsp;|&nbsp; R to restart</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
