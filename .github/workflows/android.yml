name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend deps
        run: npm ci

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2
        with:
          ndk-version: r26b

      - name: Accept licenses
        run: yes | sdkmanager --licenses 2>/dev/null || true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build frontend
        run: npm run build

      - name: Build Android APK
        continue-on-error: true
        run: |
          set -x
          NDK_VERSION=$(ls $ANDROID_HOME/ndk/ 2>/dev/null | head -1)
          ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/$NDK_VERSION"
          TOOLCHAIN="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          CLANG="$TOOLCHAIN/aarch64-linux-android33-clang"
          CXX="${CLANG%clang}clang++"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$CLANG"
          export CC="$CLANG"
          export CXX="$CXX"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_ROOT"
          export PATH="$TOOLCHAIN:$PATH"
          echo "NDK=$ANDROID_NDK_ROOT CLANG=$CLANG"
          cd src-tauri
          # Initialize Android project if not exists
          if [ ! -d "gen/android" ]; then
            npx tauri android init 2>&1 | tee /tmp/init.log
          fi
          # Build Android APK via Gradle
          npx tauri android build 2>&1 | tee /tmp/build.log
          echo "BUILD_EXIT=${PIPESTATUS[0]}" >> /tmp/build.env
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          NDK_HOME: ${{ env.NDK_HOME }}

      - name: Check build result
        run: |
          echo "Exit code: $(cat /tmp/build.env 2>/dev/null)"
          tail -60 /tmp/build.log 2>/dev/null || echo "No log"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
          retention-days: 1

      - name: Find APK files
        id: find-apk
        run: |
          # APK from tauri android build is in gen/android/
          APKS=$(find src-tauri/gen/android -name "*.apk" -type f 2>/dev/null)
          echo "APKs found: $APKS"
          echo "apk_found=$(if [ -z "$APKS" ]; then echo "false"; else echo "true"; fi)" >> $GITHUB_OUTPUT

      - name: Upload APK
        if: steps.find-apk.outputs.apk_found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: snake-game-apk
          path: src-tauri/gen/android/**/*.apk
          retention-days: 5

      - name: Create Release
        if: steps.find-apk.outputs.apk_found == 'true'
        uses: softprops/action-gh-release@v1
        with:
          files: src-tauri/gen/android/**/*.apk
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
