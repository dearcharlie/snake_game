name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend deps
        run: npm ci

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2
        with:
          ndk-version: r26b

      - name: Accept licenses
        run: yes | sdkmanager --licenses 2>/dev/null || true

      - name: Debug Android env
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "NDK_HOME=$NDK_HOME"
          find $ANDROID_HOME/ndk -name "aarch64-linux-android24-clang" 2>/dev/null | head -3

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Build frontend
        run: npm run build

      - name: Build Android APK
        run: |
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          export CC="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          export CXX="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++"
          npx tauri build --target aarch64-linux-android
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          NDK_HOME: ${{ env.NDK_HOME }}
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ env.NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang

      - name: Find APK
        run: |
          echo "=== Finding APKs ==="
          find src-tauri/target -name "*.apk" -type f 2>/dev/null
          ls -la src-tauri/target/aarch64-linux-android/release/bundle/apk/ 2>/dev/null || echo "No APK dir"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: snake-game-apk
          path: src-tauri/target/aarch64-linux-android/release/bundle/apk/**/*.apk
          retention-days: 5

      - name: Create Release
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          files: src-tauri/target/aarch64-linux-android/release/bundle/apk/*.apk
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
