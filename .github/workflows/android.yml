name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend deps
        run: npm ci

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2
        with:
          ndk-version: r26b

      - name: Accept licenses
        run: yes | sdkmanager --licenses 2>/dev/null || true

      - name: Debug Android env
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "NDK_HOME=$NDK_HOME"
          echo "JAVA_HOME=$JAVA_HOME"
          ls -la $ANDROID_HOME/ndk/ 2>/dev/null || echo "No NDK dir"
          ls -la $ANDROID_HOME/ 2>/dev/null | head -10

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-apk
        run: |
          rustup target add aarch64-linux-android
          cargo install cargo-apk

      - name: Build frontend
        run: npm run build

      - name: Init Android project
        run: |
          cd src-tauri
          echo "=== Init Android ==="
          npx tauri android init 2>&1 || true
          echo "=== Init done ==="

      - name: Build with cargo-apk
        run: |
          cd src-tauri
          echo "=== Build start ==="
          cargo apk build --release 2>&1
          echo "=== Build end ==="
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          NDK_HOME: ${{ env.NDK_HOME }}
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Find APK
        run: |
          echo "=== Finding APKs ==="
          find src-tauri/target -name "*.apk" -type f 2>/dev/null
          ls -la src-tauri/target/aarch64-linux-android/release/apk/ 2>/dev/null || echo "No APK dir"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: snake-game-apk
          path: src-tauri/target/aarch64-linux-android/release/apk/*.apk
          retention-days: 5

      - name: Create Release
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          files: src-tauri/target/aarch64-linux-android/release/apk/*.apk
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
