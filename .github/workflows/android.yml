name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend deps
        run: npm ci

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2
        with:
          ndk-version: r26b

      - name: Accept licenses
        run: yes | sdkmanager --licenses 2>/dev/null || true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Build frontend
        run: npm run build

      - name: Detect NDK toolchain
        run: |
          echo "NDK_HOME=$NDK_HOME"
          find $ANDROID_HOME/ndk -name "aarch64-linux-android*-clang*" 2>/dev/null | head -5

      - name: Build Android APK
        run: |
          CLANG=$(find $ANDROID_HOME/ndk -name "aarch64-linux-android*-clang*" -type f 2>/dev/null | head -1)
          echo "Using clang: $CLANG"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$CLANG"
          export CC="$CLANG"
          export CXX="${CLANG%clang}clang++"
          npx tauri build --target aarch64-linux-android 2>&1 | tee /tmp/build.log
          echo "EXIT_CODE=${PIPESTATUS[0]}" >> /tmp/build.env
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          NDK_HOME: ${{ env.NDK_HOME }}

      - name: Show build log
        if: always()
        run: cat /tmp/build.log | tail -50

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
          retention-days: 1

      - name: Find APK
        run: |
          echo "=== Searching for APKs ==="
          find src-tauri/target -name "*.apk" -type f 2>/dev/null
          echo "=== Checking standard paths ==="
          ls src-tauri/target/aarch64-linux-android/release/bundle/apk/ 2>/dev/null && echo "Found in bundle/apk" || true
          ls src-tauri/target/aarch64-linux-android/release/apk/ 2>/dev/null && echo "Found in release/apk" || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: snake-game-apk
          path: |
            src-tauri/target/aarch64-linux-android/release/bundle/apk/*.apk
            src-tauri/target/aarch64-linux-android/release/apk/*.apk
          retention-days: 5

      - name: Create Release
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          files: |
            src-tauri/target/aarch64-linux-android/release/bundle/apk/*.apk
            src-tauri/target/aarch64-linux-android/release/apk/*.apk
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
