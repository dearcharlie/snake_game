name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend deps
        run: npm ci

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2
        with:
          ndk-version: r26b

      - name: Accept licenses
        run: yes | sdkmanager --licenses 2>/dev/null || true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build frontend
        run: npm run build

      - name: Build Android APK
        run: |
          set -x
          ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/$(ls $ANDROID_HOME/ndk/ 2>/dev/null | head -1)"
          echo "NDK root: $ANDROID_NDK_ROOT"
          CLANG=$(find "$ANDROID_NDK_ROOT" -name "*aarch64-linux-android*clang*" 2>/dev/null | grep -v lib | head -1)
          echo "Found clang: $CLANG"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$CLANG"
          export CC="$CLANG"
          export CXX="${CLANG%clang}clang++"
          npx tauri build --target aarch64-linux-android
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          NDK_HOME: ${{ env.NDK_HOME }}

      - name: Find APK files
        id: find-apk
        run: |
          APKS=$(find src-tauri/target -name "*.apk" -type f 2>/dev/null)
          echo "APKs found: $APKS"
          if [ -z "$APKS" ]; then
            echo "apk_found=false" >> $GITHUB_OUTPUT
          else
            echo "apk_found=true" >> $GITHUB_OUTPUT
          fi
          ls src-tauri/target/aarch64-linux-android/release/ 2>/dev/null | head -10

      - name: Upload APK
        if: steps.find-apk.outputs.apk_found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: snake-game-apk
          path: src-tauri/target/**/*.apk
          retention-days: 5

      - name: Create Release
        if: steps.find-apk.outputs.apk_found == 'true'
        uses: softprops/action-gh-release@v1
        with:
          files: src-tauri/target/**/*.apk
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
