name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend deps
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2
        with:
          ndk-version: r26b

      - name: Accept licenses
        run: yes | sdkmanager --licenses 2>/dev/null || true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build Android APK
        run: |
          cd src-tauri
          cargo build --target aarch64-linux-android --release 2>&1 | tail -5
          npx tauri android init --ci 2>&1 | tail -5
          cp -r ../dist/* gen/android/app/src/main/assets/
          cd gen/android
          ./gradlew assembleRelease 2>&1 | tail -10

      - name: Find APK
        id: find-apk
        run: |
          echo "=== Searching for APK ==="
          find src-tauri/gen/android -name "*.apk" -type f 2>/dev/null
          echo "---"
          find . -name "*.apk" -type f 2>/dev/null
          echo "---"
          ls -la src-tauri/gen/android/app/build/outputs/apk/release/ 2>/dev/null || echo "No release APK dir"
          APKS=$(find . -name "*.apk" -type f 2>/dev/null)
          if [ -n "$APKS" ]; then echo "apk_found=true" >> $GITHUB_OUTPUT; else echo "apk_found=false" >> $GITHUB_OUTPUT; fi

      - name: Sign APK
        if: steps.find-apk.outputs.apk_found == 'true'
        run: |
          KEYSTORE=/tmp/debug.keystore
          if [ ! -f "$KEYSTORE" ]; then
            keytool -genkey -v -keystore $KEYSTORE -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Debug, OU=Debug, O=Debug, L=Debug, ST=Debug, C=US"
          fi
          for APK in $(find src-tauri/gen/android -name "*.apk" -type f); do
            SIGNED="${APK%.apk}-signed.apk"
            $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks $KEYSTORE --ks-pass pass:android --key-pass pass:android --ks-key-alias androiddebugkey -out $SIGNED $APK
            mv $SIGNED $APK
            echo "Signed: $(du -h $APK | cut -f1) $APK"
          done

      - name: Upload APK
        if: steps.find-apk.outputs.apk_found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: snake-game-apk
          path: src-tauri/gen/android/**/*.apk
          retention-days: 2

      - name: Create Release
        if: steps.find-apk.outputs.apk_found == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/gen/android/**/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
