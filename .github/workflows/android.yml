name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_INCREMENTAL: 0

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend deps
        run: npm ci

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install Linux deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Setup Android SDK and NDK
        uses: android-actions/setup-android@v2
        with:
          ndk-version: r26b

      - name: Accept licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Check available targets
        run: |
          echo "=== Rust targets ==="
          rustup target list --installed
          echo "=== Android SDK ==="
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "NDK_HOME=$NDK_HOME"
          ls -la $ANDROID_HOME/ndk/ 2>/dev/null || echo "No NDK found"
          echo "=== Tauri targets ==="
          cat src-tauri/tauri.conf.json | grep -A5 '"bundle"'

      - name: Build Android APK
        run: |
          echo "=== Building with tauri ==="
          npx tauri build --target aarch64-linux-android --bundles apk 2>&1
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          NDK_HOME: ${{ env.NDK_HOME }}

      - name: Check build output
        run: |
          echo "=== Looking for APKs ==="
          find src-tauri/target -name "*.apk" 2>/dev/null
          ls -la src-tauri/target/*/release/bundle/ 2>/dev/null || echo "No bundle dir"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: src-tauri/target/*/release/bundle/apk/**/*.apk
          retention-days: 5

      - name: Create Release
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          files: src-tauri/target/*/release/bundle/apk/**/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
